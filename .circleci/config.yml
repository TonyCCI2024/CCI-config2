version: 2.1

executors:
  default-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project

jobs:
  build:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: echo "Installing dependencies..."
      - run:
          name: Build Project
          command: echo "Building project..."

  test:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Run Tests
          command: echo "Running tests..."

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
